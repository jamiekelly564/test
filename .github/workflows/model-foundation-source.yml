name: Temporary model foundation validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'fix/marketfield-model-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: python3 .github/foundation-apply.py
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  publish-blobs:
    needs: verify
    if: github.head_ref == 'fix/marketfield-model-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Publish hash-verified code blobs without moving any branch
        run: python3 .github/foundation-apply.py --publish-blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-verified-code-blobs
          path: foundation-blobs.json
          retention-days: 1
