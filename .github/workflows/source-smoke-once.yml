name: One-off open map source check
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  check:
    if: github.head_ref == 'diagnostic/open-map-once-v0.8'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Current public sources, one postcode, no API credit
        run: node scripts/check-map.mjs "Queensgate" "RH1 1RT"
