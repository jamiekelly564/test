name: Temporary management source snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'feature/marketfield-management'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: management-source
          path: source.zip
          retention-days: 1
