name: Temporary reviewed demo publication
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.head_ref == 'feature/ten-property-demo' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ten-property-demo
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unpack checksum-pinned reviewed code into explicit paths
        shell: python
        run: |
          import pathlib, base64, hashlib, lzma, json
          root=pathlib.Path('.')
          parts=[(root/'.github/demo-stage'/('part-'+str(i)+'.txt')).read_text() for i in range(1,6)]
          packed=base64.b64decode(''.join(parts),validate=True)
          assert len(packed)==42928
          assert hashlib.sha256(packed).hexdigest()=='dae48b93a0ff61920627ce84f974c9c660b0580ddea78ea643a48d905dd648e8'
          files=json.loads(lzma.decompress(packed,memlimit=268435456).decode('utf8'))
          allowed={'README.md','apps/api/preview-server.mjs','apps/api/examples/routes.mjs','apps/web/public/examples/index.html','apps/web/public/examples/style.css','apps/web/public/examples/data.js','apps/web/public/examples/engine.js','apps/web/public/examples/app.js','apps/web/public/examples/sources.json','apps/web/public/examples/SOURCES.md','scripts/prepare-example-plans.py','tests/plan-library.test.mjs','docs/TEN-PROPERTY-LIBRARY.md'}
          assert set(files)==allowed
          for name,text in files.items():
              assert isinstance(text,str) and len(text)<200000
              path=root/name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf8')
          print('Wrote',len(files),'reviewed text files. No private data, keys or model uploads are included.')
      - name: Prepare licensed plan previews from exact source hashes
        run: |
          python -m pip install Pillow==12.3.0 CairoSVG==2.8.2
          python scripts/prepare-example-plans.py
      - name: Test the actual repository
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Commit only the reviewed demo files to its feature branch
        run: |
          git config user.name 'PropertyChecked build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md apps/api/preview-server.mjs apps/api/examples/routes.mjs apps/web/public/examples scripts/prepare-example-plans.py tests/plan-library.test.mjs docs/TEN-PROPERTY-LIBRARY.md
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Add ten source-plan studies and self-contained property library'
          git push origin HEAD:feature/ten-property-demo
          git archive --format=zip HEAD -o reviewed-demo.zip
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-ten-property-demo
          path: reviewed-demo.zip
          retention-days: 1
